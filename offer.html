<!DOCTYPE html>
<html lang="bn">
<head>
    <link rel="icon" type="image/x-icon" href="https://i.ibb.co.com/mFrpZ2sq/coin-logo.jpg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>কয়েন রেট - গরিবের কয়ের স্টোর</title>
    <style>
        body { font-family: 'Arial', sans-serif; background-color: #0f172a; margin: 0; padding: 0; text-align: center; color: #fff; }
        .container { padding: 40px 20px; display: flex; flex-wrap: wrap; justify-content: center; gap: 25px; max-width: 1200px; margin: 0 auto; }
        .home-btn { display: inline-block; margin-top: 25px; background: #1e293b; color: #fff; padding: 12px 35px; text-decoration: none; border-radius: 50px; font-weight: bold; border: 2px solid #fe2c55; transition: 0.4s; box-shadow: 0 0 15px rgba(254, 44, 85, 0.4); animation: homeGlow 2s linear infinite; }
        .home-btn:hover { transform: scale(1.1); background: linear-gradient(45deg, #fe2c55, #25f4ee); color: #000; }
        @keyframes rgbGlow { 0% { border-color: #fe2c55; box-shadow: 0 0 10px #fe2c55; } 33% { border-color: #25f4ee; box-shadow: 0 0 15px #25f4ee; } 66% { border-color: #FFD700; box-shadow: 0 0 10px #FFD700; } 100% { border-color: #fe2c55; box-shadow: 0 0 10px #fe2c55; } }
        @keyframes homeGlow { 0% { border-color: #fe2c55; } 50% { border-color: #25f4ee; } 100% { border-color: #fe2c55; } }
        .card { background: #1e293b; border-radius: 15px; padding: 25px; width: 260px; border: 2px solid #334155; display: flex; flex-direction: column; align-items: center; transition: 0.3s; animation: rgbGlow 3s linear infinite; }
        .card:hover { transform: translateY(-10px); filter: brightness(1.2); }
        .video-logo { width: 80px; height: 80px; border-radius: 50%; border: 2px solid #00f3ff; margin-bottom: 15px; }
        .coin-text { font-size: 28px; font-weight: bold; color: #FFD700; }
        .price { font-size: 26px; color: #39ff14; font-weight: bold; margin: 15px 0; }
        .buy-btn, .order-btn { display: inline-block; background: #25D366; color: white; padding: 12px 20px; text-decoration: none; border-radius: 50px; font-weight: bold; cursor: pointer; border: none; }
        #dhamaka-container { width: 90%; max-width: 600px; margin: 30px auto; padding: 25px; background: #1e293b; border-radius: 20px; border: 3px solid #fe2c55; text-align: center; animation: rgbGlow 1.5s linear infinite; display: none; }
        .order-btn { background-color: #fe2c55; margin-top: 15px; padding: 15px 35px; }
        .old-price { text-decoration: line-through; color: #94a3b8; font-size: 18px; margin-left: 10px; }
        footer { margin-top: 50px; padding: 20px; background: #000; }
    </style>
</head>
<body>

    <a href="index.html" class="home-btn">🏠 হোমে ফিরে যান</a>
    <h2 style="margin-top: 30px; color: #00f3ff;">আপনার পছন্দের প্যাকেজটি বেছে নিন</h2>

    <div class="container">
        <div id="dhamaka-container">
            <h2 id="dhamaka-title" style="color: #fe2c55;">🔥 ধামাকা অফার! 🔥</h2>
            <div class="coin-card">
                <h3 id="dhamaka-package" style="color: #FFD700;">লোড হচ্ছে...</h3>
                <p class="price">
                    <span id="price-dhamaka">...</span> 
                    <span class="old-price" id="old-price-val">...</span>
                </p>
                <button class="order-btn" id="dhamaka-btn">এখনই অর্ডার করুন</button>
            </div>
        </div>

        <div class="card" id="card3"><img src="https://i.ibb.co.com/vxVS7HMX/coin-logo.jpg" class="video-logo"><span class="coin-text" id="name3">...</span><p class="price" id="price3">...</p><button class="buy-btn" id="btn3">অর্ডার দিন</button></div>
        <div class="card" id="card4"><img src="https://i.ibb.co.com/vxVS7HMX/coin-logo.jpg" class="video-logo"><span class="coin-text" id="name4">...</span><p class="price" id="price4">...</p><button class="buy-btn" id="btn4">অর্ডার দিন</button></div>
        <div class="card" id="card5"><img src="https://i.ibb.co.com/vxVS7HMX/coin-logo.jpg" class="video-logo"><span class="coin-text" id="name5">...</span><p class="price" id="price5">...</p><button class="buy-btn" id="btn5">অর্ডার দিন</button></div>
        <div class="card" id="card6"><img src="https://i.ibb.co.com/vxVS7HMX/coin-logo.jpg" class="video-logo"><span class="coin-text" id="name6">...</span><p class="price" id="price6">...</p><button class="buy-btn" id="btn6">অর্ডার দিন</button></div>
        <div class="card" id="card7"><img src="https://i.ibb.co.com/vxVS7HMX/coin-logo.jpg" class="video-logo"><span class="coin-text" id="name7">...</span><p class="price" id="price7">...</p><button class="buy-btn" id="btn7">অর্ডার দিন</button></div>
        <div class="card" id="card8"><img src="https://i.ibb.co.com/vxVS7HMX/coin-logo.jpg" class="video-logo"><span class="coin-text" id="name8">...</span><p class="price" id="price8">...</p><button class="buy-btn" id="btn8">অর্ডার দিন</button></div>
        <div class="card" id="card9"><img src="https://i.ibb.co.com/vxVS7HMX/coin-logo.jpg" class="video-logo"><span class="coin-text" id="name9">...</span><p class="price" id="price9">...</p><button class="buy-btn" id="btn9">অর্ডার দিন</button></div>
        <div class="card" id="card10"><img src="https://i.ibb.co.com/vxVS7HMX/coin-logo.jpg" class="video-logo"><span class="coin-text" id="name10">...</span><p class="price" id="price10">...</p><button class="buy-btn" id="btn10">মেসেজ দিন</button></div>
    </div>

    <footer><p>&copy; 2026 TikTok Coin Store | Managed by Boss</p></footer>

    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRmGQAO-53SkCfG5Ti0qaJ3xeEHd_eQfGVdJ58nWZNCYBR7qXMK9vHKvvKBVVctD74U16SAXGJeh4NI/pub?output=csv';

        function goToWA(packageName) {
            const phoneNumber = "8801613221379";
            const encodedText = encodeURIComponent("হ্যালো বস, আমি আপনার ওয়েবসাইট থেকে " + packageName + " নিতে চাই।");
            window.location.href = "https://wa.me/" + phoneNumber + "?text=" + encodedText;
        }

        async function fetchPrices() {
            try {
                const response = await fetch(sheetUrl + '&t=' + new Date().getTime());
                const data = await response.text();
                const rows = data.split(/\r?\n/).map(row => row.split(','));

                // ১. ধামাকা অফার (শিট সারি ২, ১১, ১২)
                const dhamakaStatus = rows[10][2]?.trim().toUpperCase(); // Row 11, Col C
                const dhamakaContainer = document.getElementById('dhamaka-container');
                
                if (dhamakaStatus === 'TRUE') {
                    dhamakaContainer.style.display = 'block';
                    const dName = rows[1][0]; // ২য় সারির ১ম কলাম (২৬০ কয়েন)
                    const dPrice = rows[1][1]; // ২য় সারির ২য় কলাম (৬৩৫ টাকা)
                    const dOldPrice = rows[11][1]; // ১২ নম্বর সারির ২য় কলাম (পুরাতন দাম)
                    const dMsg = rows[11][2]; // ১২ নম্বর সারির ৩য় কলাম (বিশেষ অফার মেসেজ)

                    document.getElementById('dhamaka-package').innerText = dName;
                    document.getElementById('price-dhamaka').innerText = dPrice;
                    document.getElementById('old-price-val').innerText = dOldPrice;
                    if(dMsg) document.getElementById('dhamaka-title').innerText = "🔥 " + dMsg + " 🔥";
                    
                    document.getElementById('dhamaka-btn').onclick = () => goToWA(dName + " ধামাকা অফার");
                }

                // ২. সাধারণ প্যাকেজ (সারি ৩ থেকে ১০)
                for (let i = 2; i <= 9; i++) {
                    const row = rows[i];
                    const cardNum = i + 1; // HTML ID এর সাথে মিলানোর জন্য
                    const card = document.getElementById('card' + cardNum);
                    
                    if (row && card) {
                        const name = row[0];
                        const price = row[1];
                        const status = row[2]?.trim().toUpperCase();

                        if (status === 'TRUE' || status === 'CHECKED' || row[2]?.includes('✔')) {
                            card.style.display = 'flex';
                            document.getElementById('name' + cardNum).innerText = name;
                            document.getElementById('price' + cardNum).innerText = price;
                            document.getElementById('btn' + cardNum).onclick = () => goToWA(name);
                        } else {
                            card.style.display = 'none';
                        }
                    }
                }
            } catch (e) { console.error("Error loading sheet data:", e); }
        }
        fetchPrices();
    </script>
</body>
</html>
